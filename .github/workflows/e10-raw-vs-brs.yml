name: E10 raw model vs BRS

on:
  push:
    branches:
      - experiment/e10-raw-vs-brs
  workflow_dispatch:

jobs:
  e10:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BRS_OPENAI_MODEL: gpt-6-luna

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify secret exists
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret is missing."
            exit 1
          fi

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[openai]"

      - name: Run E10
        run: python experiments/e10_raw_vs_brs.py > e10_output.json

      - name: Show summary
        run: |
          python - <<'PY'
          import json
          with open("e10_output.json","r",encoding="utf-8") as f:
              data=json.load(f)
          print(json.dumps(data["summary"],indent=2,ensure_ascii=False))
          PY

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: e10-raw-vs-brs-results
          path: e10_output.json
