name: E12 code hidden tests

on:
  workflow_dispatch:

jobs:
  e12:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BRS_OPENAI_MODEL: gpt-6-luna

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify secret exists
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret is missing."
            exit 1
          fi

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[openai]"

      - name: Run E12
        run: python experiments/e12_code_hidden_tests.py > e12_output.json

      - name: Show summary
        run: |
          python - <<'PY'
          import json
          with open("e12_output.json","r",encoding="utf-8") as f:
              data=json.load(f)
          print(json.dumps(data["summary"],indent=2,ensure_ascii=False))
          PY

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: e12-code-hidden-tests-results
          path: e12_output.json
