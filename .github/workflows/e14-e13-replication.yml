name: E14 E13 replication

on:
  push:
    branches:
      - experiment/e14-e13-replication
  workflow_dispatch:

jobs:
  e14:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BRS_E14_MODEL: gpt-4o-mini

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify secret exists
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret is missing."
            exit 1
          fi

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[openai]"

      - name: Run E14
        run: python -m experiments.e14_e13_replication > e14_output.json

      - name: Show summary
        run: |
          python - <<'PY'
          import json
          with open("e14_output.json","r",encoding="utf-8") as f:
              data=json.load(f)
          print(json.dumps(data["summary"],indent=2,ensure_ascii=False))
          PY

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: e14-e13-replication-results
          path: e14_output.json
