name: E15-B portfolio edit benchmark

on:
  push:
    branches:
      - experiment/e15b-portfolio-edits
  workflow_dispatch:

jobs:
  e15b:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BRS_E15B_MODEL: gpt-4o-mini

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify secret exists
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret is missing."
            exit 1
          fi

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[openai]"

      - name: Run E15-B
        run: python -m experiments.e15b_portfolio_edits > e15b_output.json

      - name: Show summary
        run: |
          python - <<'PY'
          import json
          with open("e15b_output.json","r",encoding="utf-8") as f:
              data=json.load(f)
          print(json.dumps(data["summary"],indent=2,ensure_ascii=False))
          PY

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: e15b-portfolio-edit-results
          path: e15b_output.json
