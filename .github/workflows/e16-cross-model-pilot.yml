name: E16 cross-model pilot

on:
  workflow_dispatch:

jobs:
  e16:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BRS_E16_MODEL: gpt-4.1-mini

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify secret exists
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret is missing."
            exit 1
          fi

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[openai]"

      - name: Run E16
        run: python -m experiments.e16_cross_model_pilot > e16_output.json

      - name: Show summary
        run: |
          python - <<'PY'
          import json
          with open("e16_output.json","r",encoding="utf-8") as f:
              data=json.load(f)
          print(json.dumps(data["summary"],indent=2,ensure_ascii=False))
          PY

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: e16-cross-model-pilot-results
          path: e16_output.json
