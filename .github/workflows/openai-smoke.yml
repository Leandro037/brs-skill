name: OpenAI BRS smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - openai-smoke-run

jobs:
  openai-smoke:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BRS_OPENAI_MODEL: gpt-6-luna

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify secret exists
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret is missing."
            exit 1
          fi

      - name: Install BRS with OpenAI support
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[openai]"

      - name: Run end-to-end BRS + OpenAI smoke test
        run: python examples/openai_end_to_end.py
