name: Publish BRS v1.0.0 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v1-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.0 >/dev/null 2>&1; then
            echo "Tag v1.0.0 already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v1.0.0 -m "BRS Skill v1.0.0 Research Release"
            git push origin v1.0.0
          fi

      - name: Create GitHub Release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "GitHub Release v1.0.0 already exists."
          else
            gh release create v1.0.0               --title "BRS Skill v1.0.0 — Research Release"               --notes-file RELEASE_NOTES_V1.0.0.md               --verify-tag
          fi
