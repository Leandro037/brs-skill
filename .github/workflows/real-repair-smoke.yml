name: BRS real repair smoke

on:
  push:
    branches:
      - experiment/real-repair-smoke
  workflow_dispatch:

jobs:
  repair-smoke:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BRS_OPENAI_MODEL: gpt-6-luna

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify secret exists
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret is missing."
            exit 1
          fi

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[openai]"

      - name: Run real repair smoke
        run: python experiments/real_repair_smoke.py
